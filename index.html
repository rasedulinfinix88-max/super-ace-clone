<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Slot Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: radial-gradient(circle, #2a083b 0%, #090112 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Title */
        .title {
            color: #ffd700;
            font-size: 24px;
            font-weight: 900;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        /* Multiplier Bar Header */
        .multiplier-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 380px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 6px;
            margin-bottom: 10px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .multi-step {
            font-size: 15px;
            font-weight: 800;
            color: #777;
            padding: 4px 14px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .multi-step.active {
            color: #fff;
            background: linear-gradient(180deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 10px #ff4b2b;
            transform: scale(1.1);
        }

        /* 5x4 Grid Frame */
        .slot-frame {
            background: linear-gradient(180deg, #5100ad, #21004a);
            padding: 8px;
            border-radius: 16px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 25px rgba(186, 85, 211, 0.6);
            width: 100%;
            max-width: 380px;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #0d001d;
            padding: 8px;
            border-radius: 10px;
            position: relative;
        }

        /* Card Visual Styling */
        .card {
            background: linear-gradient(145deg, #2a2250, #130f2a);
            border: 2px solid #554488;
            border-radius: 8px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #e2e2e2;
            position: relative;
            box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
            transition: transform 0.2s, opacity 0.3s;
        }

        /* Special Super Ace Card Styles */
        .card.golden {
            background: linear-gradient(145deg, #fff099, #f5a623);
            border: 2px solid #ffffff;
            color: #000;
            box-shadow: 0 0 12px #ffe066;
        }

        .card.wild {
            background: linear-gradient(145deg, #ff0844, #ffb199);
            border: 2px solid #fff;
            color: #fff;
            text-shadow: 0 0 5px #000;
            box-shadow: 0 0 15px #ff0844;
        }

        .card.exploding {
            transform: scale(0);
            opacity: 0;
        }

        .card.win-highlight {
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
            animation: pulse 0.4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        /* Dashboard Stats */
        .dashboard {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 380px;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #332255;
        }

        .stat-label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
        }

        .stat-val {
            color: #00ff88;
            font-weight: bold;
            font-size: 18px;
        }

        /* Spin Button */
        .controls {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        .spin-btn {
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 14px 60px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 35px;
            box-shadow: 0 5px 20px rgba(255, 140, 0, 0.6);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background: #555;
            box-shadow: none;
            color: #888;
        }

        .status-msg {
            margin-top: 8px;
            font-size: 14px;
            color: #ffd700;
            font-weight: bold;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="title">SUPER ACE</div>

    <!-- Multiplier Bar -->
    <div class="multiplier-bar">
        <div class="multi-step active" id="m1">x1</div>
        <div class="multi-step" id="m2">x2</div>
        <div class="multi-step" id="m3">x3</div>
        <div class="multi-step" id="m5">x5</div>
    </div>

    <!-- Main Grid Slot Frame -->
    <div class="slot-frame">
        <div class="slot-grid" id="slotGrid"></div>
    </div>

    <!-- Stats Dashboard -->
    <div class="dashboard">
        <div>
            <div class="stat-label">মোট পয়েন্ট</div>
            <div class="stat-val" id="totalPoints">1000</div>
        </div>
        <div>
            <div class="stat-label">শেষ জয়</div>
            <div class="stat-val" id="lastWin">0</div>
        </div>
    </div>

    <!-- Spin Control -->
    <div class="controls">
        <button class="spin-btn" id="spinBtn" onclick="startSpin()">SPIN</button>
        <div class="status-msg" id="statusMsg">স্পিন করতে ক্লিক করুন!</div>
    </div>

    <script>
        const baseSymbols = ['J', 'Q', 'K', 'A', '♠', '♥'];
        const multipliers = [1, 2, 3, 5];
        let currentMultiIdx = 0;
        let totalScore = 1000;
        let isSpinning = false;

        // Grid Data Array (5 cols x 4 rows = 20 cells)
        let gridState = []; 

        const gridContainer = document.getElementById('slotGrid');
        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMsg');

        // Initialize Blank Grid
        function initGrid() {
            gridContainer.innerHTML = '';
            gridState = [];
            for (let i = 0; i < 20; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                
                const symData = getRandomSymbol();
                applySymbolToCard(card, symData);

                gridContainer.appendChild(card);
                gridState.push({ element: card, type: symData.type, value: symData.val });
            }
        }

        // Helper: Get Random Symbol Object
        function getRandomSymbol() {
            const rand = Math.random();
            if (rand < 0.08) {
                return { type: 'wild', val: 'WILD' };
            } else if (rand < 0.25) {
                const val = baseSymbols[Math.floor(Math.random() * baseSymbols.length)];
                return { type: 'golden', val: val };
            } else {
                const val = baseSymbols[Math.floor(Math.random() * baseSymbols.length)];
                return { type: 'normal', val: val };
            }
        }

        // Helper: Apply Styles
        function applySymbolToCard(card, symData) {
            card.innerText = symData.val;
            card.className = 'card';
            if (symData.type === 'golden') card.classList.add('golden');
            if (symData.type === 'wild') card.classList.add('wild');
        }

        // Set Multiplier Light
        function setMultiplier(idx) {
            currentMultiIdx = Math.min(idx, 3);
            for (let i = 1; i <= 4; i++) {
                const el = document.getElementById('m' + (i === 4 ? 5 : i));
                if (i - 1 === currentMultiIdx) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            }
        }

        // Main Spin Action
        async function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.disabled = true;
            statusMsg.innerText = 'স্পিন হচ্ছে...';
            
            // Reset Multiplier
            setMultiplier(0);
            document.getElementById('lastWin').innerText = '0';

            // Generate New Symbols
            for (let i = 0; i < 20; i++) {
                const symData = getRandomSymbol();
                gridState[i].type = symData.type;
                gridState[i].value = symData.val;
                applySymbolToCard(gridState[i].element, symData);
            }

            // Start Cascade Cycle
            let totalSpinWin = 0;
            let comboCount = 0;

            while (true) {
                let winIndices = checkMatches();
                if (winIndices.length === 0) break;

                // Win Found
                comboCount++;
                setMultiplier(comboCount - 1);
                const currentMulti = multipliers[currentMultiIdx];

                statusMsg.innerText = `ম্যাচ হয়েছে! Multiplier ${currentMulti}x`;

                // Highlight Winners
                winIndices.forEach(idx => gridState[idx].element.classList.add('win-highlight'));
                await sleep(500);

                // Calculate Win
                let roundWin = winIndices.length * 20 * currentMulti;
                totalSpinWin += roundWin;
                document.getElementById('lastWin').innerText = totalSpinWin;

                // Process Golden Cards -> Turn into WILDs, non-golden explode
                winIndices.forEach(idx => {
                    const item = gridState[idx];
                    if (item.type === 'golden') {
                        item.type = 'wild';
                        item.value = 'WILD';
                        applySymbolToCard(item.element, item);
                        item.element.classList.remove('win-highlight');
                    } else if (item.type !== 'wild') {
                        item.element.classList.add('exploding');
                        item.type = 'empty';
                    }
                });

                await sleep(400);

                // Drop Existing Cards & Refill (Cascading)
                dropAndRefill();
                await sleep(400);
            }

            // Finish Spin
            if (totalSpinWin > 0) {
                totalScore += totalSpinWin;
                document.getElementById('totalPoints').innerText = totalScore;
                statusMsg.innerText = `অভিনন্দন! আপনি মোট ${totalSpinWin} পয়েন্ট জিতেছেন!`;
            } else {
                statusMsg.innerText = 'আবার চেষ্টা করুন!';
            }

            isSpinning = false;
            spinBtn.disabled = false;
        }

        // Check Matches (3 or more adjacent horizontally)
        function checkMatches() {
            let winSet = new Set();
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 3; col++) {
                    let idx1 = row * 5 + col;
                    let idx2 = row * 5 + (col + 1);
                    let idx3 = row * 5 + (col + 2);

                    let sym1 = gridState[idx1];
                    let sym2 = gridState[idx2];
                    let sym3 = gridState[idx3];

                    if (sym1.type === 'empty' || sym2.type === 'empty' || sym3.type === 'empty') continue;

                    // Match logic considering WILD
                    if (isMatch(sym1, sym2) && isMatch(sym2, sym3)) {
                        winSet.add(idx1);
                        winSet.add(idx2);
                        winSet.add(idx3);
                    }
                }
            }
            return Array.from(winSet);
        }

        function isMatch(s1, s2) {
            if (s1.type === 'wild' || s2.type === 'wild') return true;
            return s1.value === s2.value;
        }

        // Drop Cards Downward and Refill Top
        function dropAndRefill() {
            for (let col = 0; col < 5; col++) {
                // Collect non-empty items in column from bottom to top
                let columnItems = [];
                for (let row = 3; row >= 0; row--) {
                    let idx = row * 5 + col;
                    if (gridState[idx].type !== 'empty') {
                        columnItems.push({ type: gridState[idx].type, value: gridState[idx].value });
                    }
                }

                // Fill remaining spaces with new symbols
                while (columnItems.length < 4) {
                    columnItems.push(getRandomSymbol());
                }

                // Apply back to grid from bottom to top
                for (let row = 3; row >= 0; row--) {
                    let idx = row * 5 + col;
                    let newSym = columnItems[3 - row];
                    gridState[idx].type = newSym.type;
                    gridState[idx].value = newSym.value;
                    applySymbolToCard(gridState[idx].element, newSym);
                }
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Run Grid on Load
        initGrid();
    </script>
</body>
</html>

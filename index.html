<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Slot Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        h1 {
            color: #f1c40f;
            margin-bottom: 15px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 5x4 Grid Layout for Mobile */
        .slot-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            background: #1e1e2f;
            padding: 10px;
            border-radius: 12px;
            border: 3px solid #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: #2a2a40;
            border: 1px solid #444466;
            border-radius: 8px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #e0e0e0;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .card.golden {
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #000;
            border: 2px solid #fff;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }

        .spin-btn {
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            cursor: pointer;
            width: 80%;
            text-transform: uppercase;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        .score-board {
            font-size: 16px;
            color: #2ecc71;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>SUPER ACE CLONE</h1>

    <!-- 5x4 Grid Slot Machine -->
    <div class="slot-container" id="slotGrid">
        <!-- 20 Cards will be generated dynamically -->
    </div>

    <div class="controls">
        <button class="spin-btn" onclick="spinReels()">SPIN</button>
        <div class="score-board" id="statusText">স্পিন করতে নিচে ক্লিক করুন</div>
    </div>

    <script>
        // Super Ace Symbols List
        const symbols = ['J', 'Q', 'K', 'A', '♠', '♥', '♦', '♣'];
        const gridContainer = document.getElementById('slotGrid');
        const statusText = document.getElementById('statusText');

        // Create initial 20 cards (5 columns x 4 rows)
        function initGrid() {
            gridContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                gridContainer.appendChild(card);
            }
        }

        // Spin Functionality
        function spinReels() {
            const cards = document.querySelectorAll('.card');
            statusText.innerText = 'স্পিন হচ্ছে...';
            
            // Randomize symbols with animation effect
            cards.forEach(card => {
                const isGolden = Math.random() < 0.15; // 15% chance for Golden Card
                const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                
                card.innerText = randomSymbol;
                
                if (isGolden) {
                    card.classList.add('golden');
                } else {
                    card.classList.remove('golden');
                }
            });

            statusText.innerText = 'স্পিন সম্পন্ন হয়েছে!';
        }

        // Initialize grid on load
        initGrid();
    </script>
</body>
</html>

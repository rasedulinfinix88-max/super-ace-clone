<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Slot Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, #2b0836 0%, #0d0214 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Top Header & Multiplier Bar */
        .header-title {
            color: #ffd700;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .multiplier-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 380px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            border-radius: 25px;
            padding: 5px 15px;
            margin-bottom: 12px;
        }

        .multi-step {
            font-size: 14px;
            font-weight: bold;
            color: #888;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .multi-step.active {
            color: #fff;
            background: linear-gradient(180deg, #ff416c, #ff4b2b);
            box-shadow: 0 0 8px #ff4b2b;
        }

        /* 5x4 Grid Frame */
        .slot-frame {
            background: linear-gradient(180deg, #4a00e0, #8e2de2);
            padding: 8px;
            border-radius: 16px;
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            width: 100%;
            max-width: 380px;
        }

        .slot-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            background: #120224;
            padding: 8px;
            border-radius: 10px;
        }

        /* Card Visual Styling */
        .card {
            background: linear-gradient(145deg, #1f1a3a, #0d0a22);
            border: 2px solid #4a3e7d;
            border-radius: 8px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            position: relative;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }

        /* Special Super Ace Card Types */
        .card.golden-card {
            background: linear-gradient(145deg, #ffe066, #f5a623);
            border: 2px solid #ffffff;
            color: #000;
            box-shadow: 0 0 10px #ffe066;
        }

        .card.wild-card {
            background: linear-gradient(145deg, #ff0844, #ffb199);
            border: 2px solid #fff;
            color: #fff;
            text-shadow: 0 0 5px #000;
            box-shadow: 0 0 12px #ff0844;
        }

        .card.win-anim {
            animation: pulse 0.5s infinite alternate;
            border-color: #00ff88;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 5px #00ff88; }
            100% { transform: scale(1.05); box-shadow: 0 0 15px #00ff88; }
        }

        /* Bottom Controls */
        .dashboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 380px;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px;
            border-radius: 10px;
        }

        .stat-val {
            color: #00ff88;
            font-weight: bold;
            font-size: 16px;
        }

        .spin-btn {
            margin-top: 12px;
            background: linear-gradient(180deg, #ffd700, #ff8c00);
            color: #000;
            border: none;
            padding: 12px 50px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.6);
            cursor: pointer;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header-title">SUPER ACE</div>

    <!-- Multiplier Bar -->
    <div class="multiplier-bar">
        <div class="multi-step active" id="m1">x1</div>
        <div class="multi-step" id="m2">x2</div>
        <div class="multi-step" id="m3">x3</div>
        <div class="multi-step" id="m5">x5</div>
    </div>

    <!-- Slot Main Frame -->
    <div class="slot-frame">
        <div class="slot-container" id="slotGrid"></div>
    </div>

    <!-- Stats -->
    <div class="dashboard">
        <div>পয়েন্ট: <span class="stat-val" id="score">1000</span></div>
        <div>জিতলেন: <span class="stat-val" id="win">0</span></div>
    </div>

    <button class="spin-btn" onclick="spin()">SPIN</button>

    <script>
        const symbols = ['J', 'Q', 'K', 'A'];
        const grid = document.getElementById('slotGrid');
        let totalScore = 1000;

        function init() {
            grid.innerHTML = '';
            for(let i=0; i<20; i++) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerText = symbols[Math.floor(Math.random()*symbols.length)];
                grid.appendChild(card);
            }
        }

        function spin() {
            const cards = document.querySelectorAll('.card');
            let winVal = 0;

            cards.forEach(card => {
                card.classList.remove('golden-card', 'wild-card', 'win-anim');
                
                const rand = Math.random();
                if(rand < 0.1) {
                    // 10% Chance Wild Card
                    card.innerText = 'WILD';
                    card.classList.add('wild-card');
                } else if(rand < 0.25) {
                    // 15% Chance Golden Card
                    card.innerText = symbols[Math.floor(Math.random()*symbols.length)];
                    card.classList.add('golden-card');
                } else {
                    card.innerText = symbols[Math.floor(Math.random()*symbols.length)];
                }
            });

            // Random Win Simulation
            if(Math.random() > 0.5) {
                winVal = Math.floor(Math.random()*100) + 20;
                totalScore += winVal;
                document.getElementById('m2').classList.add('active');
                cards[0].classList.add('win-anim');
                cards[1].classList.add('win-anim');
                cards[2].classList.add('win-anim');
            } else {
                document.getElementById('m2').classList.remove('active');
            }

            document.getElementById('score').innerText = totalScore;
            document.getElementById('win').innerText = winVal;
        }

        init();
    </script>
</body>
</html>
